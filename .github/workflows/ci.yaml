name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: gofmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache-dependency-path: src/go.sum

      - name: Check formatting
        working-directory: src
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

  verify:
    name: verify (${{ matrix.sqlite }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - sqlite: cgo
            cgo_enabled: "1"
            goflags: ""
          - sqlite: purego
            cgo_enabled: "0"
            goflags: "-tags=purego"
    env:
      CGO_ENABLED: ${{ matrix.cgo_enabled }}
      GOFLAGS: ${{ matrix.goflags }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache-dependency-path: src/go.sum

      - name: Test
        working-directory: src
        run: go test -count=1 ./...

      - name: Provider reconciliation contract
        if: matrix.sqlite == 'purego'
        working-directory: src
        run: >-
          go test -count=1
          ./cmd ./ui/rest ./usecase ./infrastructure/chatstorage ./infrastructure/whatsapp
          -run 'Provider|ReceiptEvidence'

      - name: Vet
        working-directory: src
        run: go vet ./...

      - name: Build
        working-directory: src
        run: go build ./...
